[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fms-route-studio-api"
version = "0.1.0"
description = "FMS Route Studio backend (FastAPI, API-only). Thin layer over planning_core."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "rasterio>=1.3",
    "rio-tiler>=6",
    "rio-cogeo>=5",
    "numpy>=1.24",
    "pydantic>=2.0",
    "anthropic>=0.40",
    "openai>=1.40",
    "planning_core",
]

[project.optional-dependencies]
dev = ["pytest>=7", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
