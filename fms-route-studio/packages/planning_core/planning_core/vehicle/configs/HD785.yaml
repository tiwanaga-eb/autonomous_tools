# Komatsu HD785 — リジッドフレーム・前輪操舵ダンプ（約91t級）
# 実値ベース（PathGenerator/vehicle_configs/HD785-7.yaml 由来）
id: HD785
name: Komatsu HD785-7
kinematic_type: rigid_bicycle
spec_status: measured

overall_length: 10.29
overall_width: 5.53
overall_height: 5.05

wheel_base: 4.95
max_steer_angle: 0.72        # rad (~41.3deg)
min_turning_radius: 10.1

kappa_max_fwd: 0.099
kappa_max_rev: 0.090
kappa_rate_max: 0.08
max_steer_rate: 0.45

max_speed_fwd: 18.0
max_speed_rev: 6.0

footprint_radius: 8.30        # 外接円半径＝基準点(後輪軸中心)から最遠コーナー hypot(7.825,2.765)≈8.30
road_width: 8.0
# 基準点(姿勢 x,y,yaw)＝後輪車輪軸中心（rigid_bicycle の運動学基準＝Dubins/RS/hybrid が生成する
# 経路点はこの点。footprint も同基準で剛体変換する）。x=前(+)/後(-), y=左右。
# ユーザー指定: 後輪軸中心から前端 +7.825m / 後端 -3.190m。
footprint_polygon:
  - [7.825, 2.765]
  - [7.825, -2.765]
  - [-3.190, -2.765]
  - [-3.190, 2.765]

# 安全検証(Stage 5)しきい値（暫定・要現場調整）
max_grade_pct: 30.0
min_clearance_m: 0.5

# 速度プロファイル(Stage 6)（暫定・要現場調整）
max_lateral_accel: 1.5
max_accel: 0.5
max_decel: 1.0
max_decel_loaded: 0.5          # 積載時の通常減速度（暫定: 空車比~50%。fleet予約距離は保守側=本値を使用）
