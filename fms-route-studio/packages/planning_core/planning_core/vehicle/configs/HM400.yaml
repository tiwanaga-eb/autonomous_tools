# Komatsu HM400 — アーティキュレート(中折れ)ダンプ（約40t級）
# 実値ベース（PathGenerator/vehicle_configs/HM400-5.yaml 由来）。
# v1 は自転車近似で運用（wheel_base/min_turning_radius は近似値）。
# v2 で中折れ運動学を厳密化（front_length/rear_length/max_articulation_angle, 残課題3）。
id: HM400
name: Komatsu HM400-5
kinematic_type: articulated
spec_status: measured

overall_length: 11.105
overall_width: 3.45
overall_height: 3.735

# v1 自転車近似（R8885 スペック表記より）
wheel_base: 4.35
max_steer_angle: 0.70
min_turning_radius: 8.885

kappa_max_fwd: 0.1126   # ≈1/min_turning_radius(8.885)。R_min ちょうどの経路が境界で誤違反しないよう整合
kappa_max_rev: 0.1126
kappa_rate_max: 0.12
max_steer_rate: 0.44            # g 最大操舵速度（車両の限界, 25 deg/s）

max_speed_fwd: 16.7
max_speed_rev: 6.0

footprint_radius: 8.5          # 外接円半径＝基準点(後輪軸中心)から最遠コーナー hypot(8.320,1.725)≈8.50
road_width: 5.2
# 基準点(姿勢 x,y,yaw)＝後輪2軸の中心（ユーザー指定: 前バンパーから8320mm）。
# footprint_polygon はこの基準点基準。x=前(+)/後(-), y=左右。全長11.105 = 前8.320 + 後2.785。
footprint_polygon:
  - [8.320, 1.725]
  - [8.320, -1.725]
  - [-2.785, -1.725]
  - [-2.785, 1.725]

# articulated 厳密化（HM400-5 外形図より）
max_articulation_angle: 0.785   # 45deg（外形図の中折れ角）
track_width: 2.69               # 後輪トレッド 2690mm
# 中折れ関節中心は前から約4335mm（前軸2985 + 1350）＝基準点(後輪軸中心,8320)の前方3.985m。
# 前後ユニット長（関節中心→端, 合計=全長）。
front_length: 4.34              # 前ユニット長（キャブ側）
rear_length: 6.77              # 後ユニット長（ダンプボディ側）

# 安全検証(Stage 5)しきい値（暫定・要現場調整）
max_grade_pct: 30.0
min_clearance_m: 0.5

# 運動特性(Stage 6 速度プロファイル) — HM400 実測運動特性表より（経験値含む）
max_lateral_accel: 0.98        # e-1 運用上の許容横加速度（0.1G, 荷こぼれしない範囲。コーナー速度に使用）
max_accel: 0.66                # b 最大加速度（アクセル100%相当, 0.067G, 5km/h〜）
max_decel: 0.49                # c 通常減速度（0.05G, 快適減速）
max_decel_loaded: 0.25         # c' 積載時の通常減速度（暫定: 空車比~50%。fleet予約距離は保守側=本値を使用）
accel_start: 0.35              # a 発進時加速度（0〜10km/h, 0.036G）
decel_emergency: 2.94          # d 急制動減速度（0.3G, タイヤロックしない範囲）
lateral_accel_limit: 2.45      # e-2 横加速度の構造限界（0.25G, 積荷時に転倒/構造限界）
# f 速度依存の最大操舵速度（最大ジャーク0.5 m/s^3 由来）[速度km/h, rad/s]
steer_rate_profile:
  - [0, 0.44]                  # f-1 0km/h   (25 deg/s)
  - [15, 0.16]                 # f-2 15km/h  (9.2 deg/s)
  - [30, 0.04]                 # f-3 30km/h  (2.3 deg/s)
  - [55, 0.01]                 # f-4 55km/h  (0.68 deg/s)
max_speed_downhill_empty: 6.94   # h-1 下り勾配での最大速度(空車, 25km/h)
max_speed_downhill_loaded: 4.44  # h-2 下り勾配での最大速度(積荷, 16km/h, 連続降坂リターダ性能)
