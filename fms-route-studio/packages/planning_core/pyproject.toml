[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "planning_core"
version = "0.1.0"
description = "FMS Route Studio shared planning core (geometry, costmap, planners, analysis, vehicle)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyproj>=3.4",
    "pydantic>=2.0",
    "rasterio>=1.3",
    "laspy>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
]
# 実験的 Drivable CV セグメンテーション（drivable/segment.py）用。遅延 import なので任意。
cv = [
    "opencv-python-headless>=4.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["planning_core*"]

[tool.setuptools.package-data]
planning_core = ["vehicle/configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
