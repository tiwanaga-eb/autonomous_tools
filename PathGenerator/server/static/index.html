<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mining Path Planner</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div id="app">
    <aside class="panel">
      <h1>Path Planner</h1>

      <label>Vehicle
        <select id="vehicle"></select>
      </label>
      <label>Algorithm
        <select id="algorithm">
          <option value="dubins">dubins</option>
          <option value="dubins_pp">dubins_pp</option>
          <option value="primitives">primitives</option>
        </select>
      </label>

      <label>Tolerance Pos [m]
        <input id="tolPos" type="number" step="0.01" value="0.1" />
      </label>
      <label>Tolerance Yaw [deg]
        <input id="tolYaw" type="number" step="0.1" value="5" />
      </label>
      <label>Background
        <select id="bgMode">
          <option value="grid">Grid</option>
          <option value="osm">Map (OSM)</option>
          <option value="esri">Aerial (Esri)</option>
        </select>
      </label>
      <label>Origin Lat [deg]
        <input id="originLat" type="number" step="0.000001" value="35.681236" />
      </label>
      <label>Origin Lon [deg]
        <input id="originLon" type="number" step="0.000001" value="139.767125" />
      </label>
      <label>Timeout [ms]
        <input id="timeoutMs" type="number" step="100" value="10000" />
      </label>
      <label>Sampling Count
        <input id="sampleCount" type="number" step="1" value="1200" />
      </label>
      <label>Yaw Bins
        <input id="yawBins" type="number" step="1" value="24" />
      </label>
      <label>Straight Margin [m]
        <input id="straightMargin" type="number" step="0.1" value="0.0" />
      </label>
      <label>Seed
        <input id="seed" type="number" step="1" value="42" />
      </label>

      <fieldset>
        <legend>Dubins++ Params</legend>
        <label>kappa1 ratios (csv)
          <input id="ppKappa1" type="text" value="0.7,0.85,1.0" />
        </label>
        <label>kappa2 ratios (csv)
          <input id="ppKappa2" type="text" value="0.7,0.85,1.0" />
        </label>
        <label>switch buffers [m] (csv)
          <input id="ppSwitchBuffers" type="text" value="0,1,2,3,4" />
        </label>
        <label>switch yaw offsets [deg] (csv)
          <input id="ppYawOffsets" type="text" value="-25,-10,0,10,25" />
        </label>
        <label>arc sample step [m]
          <input id="ppArcStep" type="number" step="0.05" value="0.2" />
        </label>
        <label>max reverse ratio
          <input id="ppMaxRevRatio" type="number" step="0.1" value="1.5" />
        </label>
        <label>switch yaw limit [deg]
          <input id="ppSwitchYawLimit" type="number" step="1" value="30" />
        </label>
        <label>kappa switch limit ratio
          <input id="ppKappaSwitchLimitRatio" type="number" step="0.05" value="0.2" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Dubins++ Behavioral</legend>
        <label>reverse arc ratio limit
          <input id="ppReverseArcRatioLimit" type="number" step="0.05" value="0.45" />
        </label>
        <label>switch sector d_min [m]
          <input id="ppSwitchSectorDMin" type="number" step="0.5" value="3.0" />
        </label>
        <label>switch sector d_max [m]
          <input id="ppSwitchSectorDMax" type="number" step="0.5" value="30.0" />
        </label>
        <label>switch sector angle [deg]
          <input id="ppSwitchSectorAngleDeg" type="number" step="1" value="45" />
        </label>
        <label>delta neutral limit [deg]
          <input id="ppDeltaNeutralLimitDeg" type="number" step="1" value="18" />
        </label>
        <label>forward length ratio
          <input id="ppForwardLengthRatio" type="number" step="0.1" value="0.8" />
        </label>
        <label>entry angle limit [deg]
          <input id="ppEntryAngleLimitDeg" type="number" step="1" value="35" />
        </label>
        <label>switch rank min obstacle clr [m]
          <input id="ppSwitchRankMinObstacleClearance" type="number" step="0.1" value="0.0" />
        </label>
        <label>switch rank min edge margin [m]
          <input id="ppSwitchRankMinEdgeMargin" type="number" step="0.1" value="0.0" />
        </label>
        <button id="applyMiningPreset" type="button">Apply Mining Preset (Strict)</button>
      </fieldset>

      <fieldset>
        <legend>Primitives Params</legend>
        <label>XY Res [m]
          <input id="primXyRes" type="number" step="0.1" value="1.0" />
        </label>
        <label>Delta Bins
          <input id="primDeltaBins" type="number" step="1" value="11" />
        </label>
        <label>Primitive T [s]
          <input id="primT" type="number" step="0.1" value="0.6" />
        </label>
        <label>Primitive dt [s]
          <input id="primDt" type="number" step="0.01" value="0.1" />
        </label>
        <label>Speed Levels
          <input id="primSpeedLevels" type="number" step="1" value="1" />
        </label>
        <label>DeltaDot Levels
          <input id="primDeltaDotLevels" type="number" step="1" value="3" />
        </label>
        <label>v_fwd [m/s]
          <input id="primVFwd" type="number" step="0.1" value="3.0" />
        </label>
        <label>v_rev [m/s]
          <input id="primVRev" type="number" step="0.1" value="2.0" />
        </label>
        <label>Switch Dist [m]
          <input id="primSwitchDist" type="number" step="1" value="18" />
        </label>
        <label>Max Nodes
          <input id="primMaxNodes" type="number" step="1000" value="18000" />
        </label>
        <label>Corridor Width [m]
          <input id="primCorridorWidth" type="number" step="1" value="12" />
        </label>
        <label>Dist Increase Limit [m]
          <input id="primDistIncLimit" type="number" step="0.5" value="3.0" />
        </label>
        <label>A* Weight
          <input id="primAstarWeight" type="number" step="0.1" value="1.8" />
        </label>
        <label>Collision Stride
          <input id="primCollisionStride" type="number" step="1" value="3" />
        </label>
      </fieldset>
      <label>
        <input id="enableSmoothing" type="checkbox" checked />
        Enable smoothing
      </label>

      <label>W Length
        <input id="wLen" type="range" min="0" max="5" step="0.1" value="1.0" />
      </label>
      <label>W Time
        <input id="wTime" type="range" min="0" max="5" step="0.1" value="1.0" />
      </label>
      <label>W Reverse
        <input id="wRev" type="range" min="0" max="5" step="0.1" value="2.0" />
      </label>
      <label>W Goal
        <input id="wGoal" type="range" min="0" max="20" step="0.5" value="5.0" />
      </label>

      <fieldset>
        <legend>Pose Yaw [deg]</legend>
        <label>Start Yaw
          <input id="startYaw" type="number" step="1" value="0" />
        </label>
        <label>Dock Yaw
          <input id="dockYaw" type="number" step="1" value="180" />
        </label>
        <label>Exit Yaw
          <input id="exitYaw" type="number" step="1" value="90" />
        </label>
      </fieldset>

      <button id="generateBtn" class="primary">Generate Path</button>

      <div class="modes">
        <button data-mode="draw_drivable">Draw Drivable</button>
        <button data-mode="draw_obstacle">Draw Obstacle</button>
        <button data-mode="set_start">Set Start</button>
        <button data-mode="set_dock">Set Dock</button>
        <button data-mode="set_exit">Set Exit</button>
        <button id="finishPolygon">Finish Polygon</button>
        <button id="clearAll">Clear</button>
      </div>

      <p class="hint">左クリックで点追加。右ドラッグでパン、ホイールでズーム。障害物は Finish Polygon で確定。</p>
      <div id="statusBox"></div>
    </aside>

    <main class="canvasWrap">
      <canvas id="mapCanvas" width="1200" height="800"></canvas>
      <div id="metricsBox"></div>
      <div id="banner" class="hidden"></div>
    </main>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
