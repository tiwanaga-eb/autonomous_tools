<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Backhoe Sim</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1c20; color: #e0e0e0; font-family: monospace; overflow: hidden; }
    #canvas { display: block; width: 100vw; height: 100vh; }

    #hud {
      position: fixed; top: 12px; left: 12px;
      background: rgba(0,0,0,0.65); border-radius: 6px;
      padding: 10px 14px; font-size: 12px; line-height: 1.7;
      pointer-events: none; min-width: 220px;
    }
    #hud .label { color: #aaa; }
    #hud .val   { color: #7ef; font-weight: bold; }
    #hud .warn  { color: #f80; }
    #hud .safe  { color: #4c4; }

    #joystick-wrap {
      position: fixed; bottom: 20px; right: 20px;
      display: flex; gap: 16px;
    }
    .js-canvas {
      border-radius: 50%; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15); touch-action: none;
    }

    #conn-badge {
      position: fixed; top: 12px; right: 12px;
      padding: 4px 10px; border-radius: 4px; font-size: 11px;
      background: #600; color: #f88;
    }
    #conn-badge.connected { background: #040; color: #8f8; }

    #graphs {
      position: fixed; bottom: 20px; left: 20px;
      display: flex; gap: 8px; pointer-events: none;
    }
    .graph-canvas {
      border: 1px solid #555; background: rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="hud">
    <div><span class="label">MODE </span><span class="val" id="h-mode">–</span></div>
    <div><span class="label">PHASE</span><span class="val" id="h-phase">–</span></div>
    <div><span class="label">TIP  </span><span class="val" id="h-tip">–</span></div>
    <div><span class="label">PAYL </span><span class="val" id="h-payload">–</span></div>
    <div><span class="label">Q sw </span><span class="val" id="h-q0">–</span></div>
    <div><span class="label">Q bm </span><span class="val" id="h-q1">–</span></div>
    <div><span class="label">Q ar </span><span class="val" id="h-q2">–</span></div>
    <div><span class="label">Q bk </span><span class="val" id="h-q3">–</span></div>
    <div><span class="label">SAFE </span><span id="h-safe">–</span></div>
    <div><span class="label">min-h</span><span class="val" id="h-minh">–</span></div>
  </div>

  <div id="joystick-wrap">
    <canvas id="js-left"  class="js-canvas" width="120" height="120"></canvas>
    <canvas id="js-right" class="js-canvas" width="120" height="120"></canvas>
  </div>

  <div id="graphs">
    <canvas id="graph-payload" class="graph-canvas" width="150" height="80"></canvas>
    <canvas id="graph-force"   class="graph-canvas" width="150" height="80"></canvas>
    <canvas id="graph-safety"  class="graph-canvas" width="150" height="80"></canvas>
  </div>

  <div id="conn-badge">● DISCONNECTED</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
